<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Switch Case</title>
</head>
<body>

<script>
    console.log('1'===1)

    //1,2...5
    let day = prompt("Enter day of the week")

    console.log(typeof day)

    // day===1 '1'===1
    switch (+day) {
        case 1:
            console.log("Rate is 200")
            break
        case 2:
            console.log("Rate is 210")
            break
        case 3:
            console.log("Rate is 230")
            break
        case 4:
            console.log("Rate is 245")
            break
        case 5:
        case 6:
        case 7:
            console.log("Rate is 270")
            break
        default:
            console.log("Invalid value")
    }

//     loops, functions/inbulit, custom, strings, numbers, arrays, arrow functions
    //objects// classes // promises // async, await
    //modules, export, import
    //listeners/forms /dom/

    //node , webstorm

</script>

</body>
</html>
